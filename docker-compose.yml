version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: civicpulse_db
    restart: always
    environment:
      POSTGRES_DB: civicpulse_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: civicpulse_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/civicpulse_db
    depends_on:
      - db
    volumes:
      - ./backend:/app

volumes:
  pgdata: