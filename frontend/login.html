<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CivicPulse - Authentication Gateway</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 flex items-center justify-center min-h-screen p-4 font-sans">

  <div class="w-full max-w-md bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl p-6 sm:p-8 space-y-6">
    <div class="text-center space-y-1">
      <div class="inline-flex items-center space-x-2 text-2xl font-black tracking-wider text-blue-400">
        <span>CIVICPULSE</span>
      </div>
      <p class="text-xs text-slate-400">Unified Municipal & Citizen Engagement Platform</p>
    </div>

    <div class="grid grid-cols-2 p-1 bg-slate-900/80 rounded-xl border border-slate-700 text-xs font-bold">
      <button id="roleCitizenBtn" type="button" onclick="setRole('citizen')" class="py-2.5 rounded-lg bg-blue-600 text-white transition">
        👤 Citizen Access
      </button>
      <button id="roleAdminBtn" type="button" onclick="setRole('admin')" class="py-2.5 rounded-lg text-slate-400 hover:text-white transition">
        🏛️ Municipal Officer
      </button>
    </div>

    <div id="errorBanner" class="hidden p-3 bg-red-500/20 border border-red-500/40 text-red-300 text-xs rounded-lg font-medium"></div>

    <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4 text-xs">
      <div>
        <label id="userLabel" class="block font-semibold mb-1 text-slate-300">Citizen Email</label>
        <input type="email" id="username" required autocomplete="username"
          class="w-full p-3 rounded-lg bg-slate-900 border border-slate-600 text-white outline-none focus:border-blue-500">
      </div>

      <div>
        <label class="block font-semibold mb-1 text-slate-300">Password</label>
        <input type="password" id="password" required autocomplete="current-password"
          class="w-full p-3 rounded-lg bg-slate-900 border border-slate-600 text-white outline-none focus:border-blue-500">
      </div>

      <button type="submit" id="submitBtn"
        class="w-full py-3 bg-blue-600 hover:bg-blue-500 font-bold text-white rounded-lg transition shadow-md disabled:opacity-60">
        Enter CivicPulse Portal
      </button>
    </form>

    <div class="border-t border-slate-700/80 pt-4 space-y-2">
      <p class="text-[11px] font-semibold text-slate-400 text-center">⚡ Pitch Evaluation Demo Presets</p>
      <div class="grid grid-cols-2 gap-2 text-[11px]">
        <button type="button" onclick="autofillCitizen()"
          class="py-2 px-2 bg-slate-700/60 hover:bg-slate-700 border border-slate-600 rounded text-slate-300 transition text-center">
          Autofill Citizen
        </button>
        <button type="button" onclick="autofillAdmin()"
          class="py-2 px-2 bg-slate-700/60 hover:bg-slate-700 border border-slate-600 rounded text-slate-300 transition text-center">
          Autofill Officer
        </button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "http://localhost:8000";
    let activeRole = "citizen";

    function setRole(role) {
      activeRole = role;

      const citizenBtn = document.getElementById("roleCitizenBtn");
      const adminBtn = document.getElementById("roleAdminBtn");
      const userLabel = document.getElementById("userLabel");

      if (role === "citizen") {
        citizenBtn.className = "py-2.5 rounded-lg bg-blue-600 text-white font-bold transition";
        adminBtn.className = "py-2.5 rounded-lg text-slate-400 hover:text-white font-bold transition";
        userLabel.innerText = "Citizen Email";
      } else {
        adminBtn.className = "py-2.5 rounded-lg bg-blue-600 text-white font-bold transition";
        citizenBtn.className = "py-2.5 rounded-lg text-slate-400 hover:text-white font-bold transition";
        userLabel.innerText = "Government Official Email";
      }

      hideError();
    }

    function showError(message) {
      const banner = document.getElementById("errorBanner");
      banner.innerText = message;
      banner.classList.remove("hidden");
    }

    function hideError() {
      document.getElementById("errorBanner").classList.add("hidden");
    }

    function autofillCitizen() {
      setRole("citizen");
      document.getElementById("username").value = "citizen@civicpulse.in";
      document.getElementById("password").value = "citizen123";
    }

    function autofillAdmin() {
      setRole("admin");
      document.getElementById("username").value = "admin@coimbatore.gov.in";
      document.getElementById("password").value = "admin123";
    }

    async function handleLogin(event) {
      event.preventDefault();
      hideError();

      const button = document.getElementById("submitBtn");
      button.innerText = "Authenticating...";
      button.disabled = true;

      const payload = {
        username: document.getElementById("username").value.trim(),
        password: document.getElementById("password").value,
        role: activeRole
      };

      try {
        const response = await fetch(`${API_BASE}/api/v1/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (!response.ok || !data.token) {
          throw new Error(data.detail || "Authentication failed");
        }

        localStorage.setItem("cp_user", JSON.stringify(data));
        window.location.href = data.redirect;
      } catch (error) {
        showError(error.message || "Unable to reach the CivicPulse backend.");
      } finally {
        button.innerText = "Enter CivicPulse Portal";
        button.disabled = false;
      }
    }
  </script>
</body>
</html>
